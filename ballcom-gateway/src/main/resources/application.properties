# De poort waar de Gateway op draait
server.port=8080

# Routing configuratie

spring.cloud.gateway.routes[0].id=payment-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/payments/**

spring.cloud.gateway.routes[1].id=ordering-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/orders,/orders/**

spring.cloud.gateway.routes[2].id=customer-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/customers/**

spring.cloud.gateway.routes[3].id=shipment-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/shipments/**

spring.cloud.gateway.routes[4].id=catalog-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/catalogs,/catalogs/**,/catalog,/catalog/**


spring.main.web-application-type=reactive