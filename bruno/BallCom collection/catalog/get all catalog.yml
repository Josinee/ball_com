info:
  name: get all catalog
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/catalog
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (Array.isArray(data) && data.length > 0) {
          const firstItem = data[0];
          if (firstItem.catalogId) {
            bru.setEnvVar("catalogId", firstItem.catalogId);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
