info:
  name: get all customers
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/customers
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        if (Array.isArray(data) && data.length > 0) {
          const firstCustomer = data[0];
          if (firstCustomer.customerId) {
            bru.setEnvVar("customerId", firstCustomer.customerId);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
