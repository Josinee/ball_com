    data: |-
      {
        "customerId": "a3b1c2d3-e4f5-6a7b-8c9d-0e1f2a3b4c5d",
        "items": [
          {
            "productId": "99999999-ffff-ffff-ffff-999999999999",
            "quantity": 2,
            "unitPrice": 12.50
          },
          {
            "productId": "88888888-eeee-eeee-eeee-888888888888",
            "quantity": 1,
            "unitPrice": 45.00
          }
        ],
        "paymentMethod": "PREPAY"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        if (data && data.orderId) {
          bru.setEnvVar("orderIdPrePay", data.orderId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
